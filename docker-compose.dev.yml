x-app: &app
  build:
    context: .
    target: dev
  env_file: .env
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker -l info

  beat:
    <<: *app
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fotoflash
      POSTGRES_USER: fotoflash
      POSTGRES_PASSWORD: fotoflash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fotoflash"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  pgdata:
